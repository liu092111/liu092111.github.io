<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The cost-of-change staircase, the same figure the /designed page argues
    from. Three treads read cleanly at 16px, and the last one carries the
    signal colour exactly as it does in FIG 1.2.

    Colours are inlined rather than tokenised: a favicon is fetched outside the
    page, so it cannot see the site's CSS custom properties. The media query is
    the only way it can follow the browser's colour scheme.
  -->
  <style>
    .ink {
      stroke: #17191c;
    }
    .signal {
      stroke: #9c4712;
    }
    @media (prefers-color-scheme: dark) {
      .ink {
        stroke: #e9e7e2;
      }
      .signal {
        stroke: #e0904f;
      }
    }
  </style>
  <g fill="none" stroke-width="3.5" stroke-linecap="square">
    <polyline class="ink" points="3,27 12,27 12,18 21,18" />
    <polyline class="signal" points="21,18 21,9 30,9" />
  </g>
</svg>
